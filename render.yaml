services:
  - type: web
    name: gen-ai-virtual-tryon
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: https://gen-ai-virtual-tryon.onrender.com
    healthCheckPath: /health
    autoDeploy: true
    branch: main

